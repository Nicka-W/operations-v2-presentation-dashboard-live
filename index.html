<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hydrofire Cape Town Warehouse Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d16; --panel:#131826; --panel2:#171d2e; --line:#232a3d;
  --text:#f2f4f8; --muted:#9aa4b8;
  --blue:#1b75bc; --blue-l:#4fa3e0; --f1:#f5841f; --f2:#ef4136; --f3:#c1272d;
  --good:#3ddc97; --warn:#ffb454; --bad:#ff5470;
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.5 'Inter',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;position:relative}
body::before{content:"";position:fixed;top:-20%;left:0;width:100%;height:480px;pointer-events:none;z-index:0;
  background:radial-gradient(circle at 8% 0%,rgba(27,117,188,.16),transparent 55%),radial-gradient(circle at 32% 10%,rgba(245,132,31,.10),transparent 50%);
  -webkit-mask-image:linear-gradient(to bottom,#000 45%,transparent);mask-image:linear-gradient(to bottom,#000 45%,transparent)}
.shell{max-width:1480px;margin:0 auto;padding:22px 24px 40px;position:relative;z-index:1}

/* header */
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;padding:4px 0 14px}
.brand{display:flex;align-items:center;gap:16px}
.brand img{height:62px;width:auto;display:block;filter:drop-shadow(0 0 22px rgba(239,65,54,.35))}
.brand-divider{width:1px;height:34px;background:var(--line)}
.brand-text{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--f1)}
h1{font-family:'Sora','Inter',sans-serif;font-size:30px;font-weight:800;letter-spacing:-.02em;color:#f7f9ff;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.head-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.head-row,.refresh-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.status{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid currentColor;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--good);background:rgba(61,220,151,.08)}
.status.warn{color:var(--warn);background:rgba(255,180,84,.08)}
.status.bad{color:var(--bad);background:rgba(255,84,112,.08)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.5}100%{transform:scale(1);opacity:1}}
.latest{background:var(--panel);border:1px solid rgba(79,163,224,.35);border-radius:999px;padding:6px 16px;font-size:13px;color:var(--muted)}
.latest b{color:var(--text);font-weight:600}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:7px 14px;border-radius:8px;cursor:pointer;font:600 12px 'Inter',sans-serif;transition:border-color .15s,color .15s}
.btn:hover{border-color:var(--f1);color:var(--f1)}
.btn[disabled]{opacity:.6;cursor:wait}
.count{font-size:11px;color:var(--muted)}
.brand-stripe{height:3px;border-radius:999px;background:linear-gradient(90deg,var(--blue) 0%,var(--f1) 55%,var(--f3) 100%);box-shadow:0 0 16px rgba(239,65,54,.35),0 0 16px rgba(27,117,188,.25)}

/* KPI cards */
.summary{display:flex;flex-wrap:nowrap;gap:10px;padding:18px 2px 12px;overflow-x:auto}
.stat{flex:1 1 0;min-width:112px;background:var(--panel);border:1px solid var(--line);border-left:3px solid transparent;border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s,transform .1s,box-shadow .15s}
.stat:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(27,117,188,.18)}
.stat.active{border-color:var(--blue-l);border-left:3px solid var(--f1);box-shadow:0 0 0 1px rgba(79,163,224,.25)}
.k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:'Sora','Inter',sans-serif;font-size:23px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:5px;white-space:nowrap}
.sd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;position:relative;top:-2px}
.sd.good{background:var(--good)} .sd.warn{background:var(--warn)} .sd.bad{background:var(--bad)}

/* controls */
.controls{display:flex;justify-content:flex-end;padding:2px 2px 0}
.toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.toggle button{background:var(--panel);color:var(--muted);border:none;padding:7px 18px;font:500 12px 'Inter',sans-serif;cursor:pointer}
.toggle button.active{background:linear-gradient(90deg,var(--blue-l),var(--f1));color:#0a0d16;font-weight:700}

/* panels */
.surface{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;transition:border-color .2s}
.surface:hover{border-color:rgba(79,163,224,.3)}
.workspace{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,1fr);gap:16px;margin-top:14px}
.section-label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--f1);margin-bottom:8px}
.detail-title{font-family:'Sora','Inter',sans-serif;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.detail-copy{color:var(--muted);margin-top:10px;max-width:640px}
.fact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.fact{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.fact .v{font-family:'Sora','Inter',sans-serif;font-size:22px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.content{margin-top:16px;position:relative;overflow:hidden}
.content-title{font-family:'Sora','Inter',sans-serif;font-size:18px;font-weight:700;margin-bottom:16px}

/* flame glow behind charts */
.chart-wrap{position:relative;height:320px}
.chart-wrap canvas{position:relative;z-index:1}
.chart-wrap::before{content:"";position:absolute;inset:-10%;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 20% 85%,rgba(245,132,31,.24),transparent 42%),radial-gradient(circle at 55% 95%,rgba(239,65,54,.20),transparent 46%),radial-gradient(circle at 80% 88%,rgba(193,39,45,.16),transparent 40%);
  filter:blur(30px);animation:ember 4.5s ease-in-out infinite alternate}
@keyframes ember{0%{opacity:.55;transform:scale(1) translateY(0)}35%{opacity:.85;transform:scale(1.04) translateY(-6px)}65%{opacity:.65;transform:scale(.98) translateY(3px)}100%{opacity:.9;transform:scale(1.03) translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.chart-wrap::before{animation:none;opacity:.7}.dot{animation:none}}

/* table */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:560px}
table{width:100%;border-collapse:collapse;min-width:480px}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:#1a2133;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;z-index:2}
tr:nth-child(even) td{background:rgba(255,255,255,.025)}
th:first-child,td:first-child{position:sticky;left:0;z-index:1}
th:first-child{background:#1a2133;z-index:3}
td:first-child{background:var(--panel)}
tr:nth-child(even) td:first-child{background:#151b2b}

.empty{padding:28px 20px;text-align:center;color:var(--muted);font-size:12px}

@media (max-width:980px){.workspace{grid-template-columns:1fr}.head-side{align-items:flex-start}.head-row,.refresh-row{justify-content:flex-start}}
@media (max-width:720px){.shell{padding:16px 12px 34px}.surface{padding:16px}h1{font-size:22px}.brand img{height:44px}.detail-title{font-size:24px}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <img src="logo.png" alt="Hydrofire logo">
      <div class="brand-divider"></div>
      <div class="brand-text">
        <span class="eyebrow">Hydrofire Operations</span>
        <h1>Cape Town Warehouse Dashboard</h1>
      </div>
    </div>
    <div class="head-side">
      <div class="head-row">
        <div class="status" id="statusBadge"><span class="dot"></span><span id="statusText">Loading</span></div>
        <div class="latest">Latest reading: <b id="generatedAt">&mdash;</b></div>
      </div>
      <div class="refresh-row">
        <button class="btn" id="refreshBtn" onclick="manualRefresh()">Refresh Now</button>
        <span class="count" id="countdown">Next check in 60s</span>
      </div>
    </div>
  </header>
  <div class="brand-stripe"></div>

  <section class="summary" id="summaryGrid"></section>

  <div class="controls">
    <div class="toggle">
      <button class="active" id="tableBtn" onclick="setView('table')">Table</button>
      <button id="chartBtn" onclick="setView('chart')">Chart</button>
    </div>
  </div>

  <section class="workspace">
    <div class="surface">
      <div class="section-label">KPI</div>
      <div class="detail-title" id="datasetTitle">Loading...</div>
      <p class="detail-copy" id="datasetDescription"></p>
    </div>
    <div class="fact-grid" id="factGrid"></div>
  </section>

  <section class="surface content" id="contentSurface">
    <div class="content-title" id="contentTitle">Table</div>
    <div id="contentBody"></div>
    <div class="chart-wrap" id="chartWrap" style="display:none"><canvas id="chartCanvas"></canvas></div>
  </section>
</div>

<script>
const KPI_DEFS = [
  { key: 'housekeeping',        label: 'Housekeeping',       type: 'housekeeping' },
  { key: 'container-jhb',       label: 'JHB Accuracy',       type: 'accuracy' },
  { key: 'container-george',    label: 'George Accuracy',    type: 'accuracy' },
  { key: 'urgent-orders',       label: 'Urgent Orders',      type: 'urgent' },
  { key: 'dispatch-accuracy',   label: 'Dispatch Accuracy',  type: 'accuracy' },
  { key: 'sku-share',           label: 'SKU Share',          type: 'donut' },
  { key: 'sku-monthly',         label: 'SKU 2026 YTD',       type: 'sku_monthly' },
  { key: 'assembly-backorders', label: 'Assembly Fill Rate', type: 'fill_rate' },
];
const KPI_COLORS = {
  'housekeeping': '#4fa3e0', 'container-jhb': '#1b75bc', 'container-george': '#38bdf8',
  'dispatch-accuracy': '#8b7cf6', 'urgent-orders': '#f5841f', 'assembly-backorders': '#3ddc97',
};
const PALETTE = ['#4fa3e0', '#3ddc97', '#ffb454', '#ff5470', '#a78bfa', '#f472b6', '#facc15', '#38bdf8'];

let dashboard = null;
let selectedKey = 'housekeeping';
let viewMode = 'table';
let chartInstance = null;
let refreshBusy = false, refreshTimer = null, countdownTimer = null, countdownValue = 60;

Chart.defaults.font.family = "'Inter', sans-serif";

function hexToRgba(hex, alpha) {
  const n = parseInt(hex.replace('#', ''), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
}

/* ---------- helpers ---------- */
function esc(v) {
  return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
const isNum = v => typeof v === 'number' && isFinite(v);
const pct1 = v => isNum(v) ? (v * 100).toFixed(1) + '%' : '-';
const int = v => isNum(v) ? Number(v).toLocaleString('en-ZA', { maximumFractionDigits: 0 }) : '-';
function fmt(value, format) {
  if (value === null || value === undefined || value === '') return '-';
  if (format === 'percent') return pct1(Number(value));
  if (format === 'integer') return int(Number(value));
  return esc(value);
}
function fmtDate(value) {
  try {
    return new Intl.DateTimeFormat('en-ZA', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'Africa/Johannesburg' }).format(new Date(value));
  } catch (e) { return value || 'Unknown'; }
}
function lastNum(a) { for (let i = a.length - 1; i >= 0; i--) if (isNum(a[i])) return a[i]; return null; }
function maxNum(a) { const n = a.filter(isNum); return n.length ? Math.max(...n) : null; }
function minNum(a) { const n = a.filter(isNum); return n.length ? Math.min(...n) : null; }

function toneFor(type, v) {
  if (!isNum(v)) return '';
  if (type === 'housekeeping') return v < 0.50 ? 'bad' : v < 0.80 ? 'warn' : 'good';
  if (type === 'accuracy')     return v <= 0.97 ? 'bad' : v < 0.99 ? 'warn' : 'good';
  if (type === 'urgent')       return v <= 0.05 ? 'good' : v <= 0.10 ? 'warn' : 'bad';
  if (type === 'fill_rate')    return v < 0.70 ? 'bad' : v < 0.85 ? 'warn' : 'good';
  return '';
}

function percentFacts(values, target) {
  const out = [{ label: 'Latest', value: pct1(lastNum(values)) }];
  if (target !== null && target !== undefined) out.push({ label: 'Target', value: pct1(target) });
  out.push({ label: 'Highest', value: pct1(maxNum(values)) }, { label: 'Lowest', value: pct1(minNum(values)) });
  return out;
}

/* Chart spec for a percentage KPI: fixed 0-100% axis in 10% steps unless a max is given */
function percentChart(labels, values, color, target, yMax, hideMain) {
  return { kind: 'percent', labels, values, color, target, yMax: yMax || 1, hideMain };
}

/* ---------- adapt the V2 dashboard_data.json into display datasets ---------- */
function buildDataset(def, kpi) {
  const color = KPI_COLORS[def.key] || '#4fa3e0';
  const ds = { key: def.key, label: def.label, type: def.type };

  if (def.type === 'housekeeping') {
    const weekly = kpi && Array.isArray(kpi.weekly) ? kpi.weekly : [];
    const values = weekly.map(r => r.value_92m);
    const latest = lastNum(values);
    ds.card = { value: pct1(latest), tone: toneFor('housekeeping', latest) };
    ds.description = 'Target 80%. Green at 80% or above, orange from 50%, red below 50%.';
    ds.facts = percentFacts(values, 0.80);
    ds.table = { columns: [{ key: 'week', label: 'Week' }, { key: 'v92', label: '92M', format: 'percent' }, { key: 'v12', label: '12M', format: 'percent' }],
                 rows: weekly.map(r => ({ week: r.week, v92: r.value_92m, v12: r.value_12m })) };
    ds.chart = percentChart(weekly.map(r => r.week), values, color, 0.80, 1, true);
  } else if (def.type === 'accuracy') {
    const arr = Array.isArray(kpi) ? kpi : [];
    const values = arr.map(r => r.value);
    const latest = lastNum(values);
    ds.card = { value: pct1(latest), tone: toneFor('accuracy', latest) };
    ds.description = 'Target 100%. Green at 99% or above, orange between 97% and 99%, red at 97% or below.';
    ds.facts = percentFacts(values, 1.0);
    ds.table = { columns: [{ key: 'label', label: 'Period' }, { key: 'value', label: 'Value', format: 'percent' }], rows: arr };
    ds.chart = percentChart(arr.map(r => r.label), values, color, 1.0, 1, true);
  } else if (def.type === 'urgent') {
    const arr = Array.isArray(kpi) ? kpi : [];
    const values = arr.map(r => r.value);
    const latest = lastNum(values);
    const top = Math.max(0.1, Math.ceil((maxNum(values) || 0) * 10 - 1e-9) / 10);
    ds.card = { value: pct1(latest), tone: toneFor('urgent', latest) };
    ds.description = 'Lower is better. Green up to 5%, orange up to 10%, red above 10%.';
    ds.facts = percentFacts(values, null);
    ds.table = { columns: [{ key: 'label', label: 'Period' }, { key: 'value', label: 'Value', format: 'percent' }], rows: arr };
    ds.chart = percentChart(arr.map(r => r.label), values, color, null, top, true);
  } else if (def.type === 'fill_rate') {
    const arr = Array.isArray(kpi) ? kpi : [];
    const values = arr.map(r => r.fill_rate);
    const latest = lastNum(values);
    ds.card = { value: pct1(latest), tone: toneFor('fill_rate', latest) };
    ds.description = 'Target 85%. Green at 85% or above, orange from 70%, red below 70%.';
    ds.facts = percentFacts(values, 0.85);
    ds.table = { columns: [{ key: 'month', label: 'Month' }, { key: 'assembled', label: 'Assembled', format: 'integer' }, { key: 'backorders', label: 'Backorders', format: 'integer' }, { key: 'fill_rate', label: 'Fill Rate', format: 'percent' }], rows: arr };
    ds.chart = percentChart(arr.map(r => r.month), values, color, 0.85, 1, false);
  } else if (def.type === 'donut') {
    const arr = Array.isArray(kpi) ? kpi : [];
    const top = arr.length ? arr.reduce((a, b) => (b.share > a.share ? b : a)) : null;
    const total = arr.reduce((s, r) => s + (Number(r.count) || 0), 0);
    ds.card = { value: top ? top.picker : '-', tone: '' };
    ds.description = 'Share of the total picked by each picker.';
    ds.facts = [{ label: 'Top picker', value: top ? top.picker : '-' }, { label: 'Top share', value: top ? pct1(top.share) : '-' }, { label: 'Total picked', value: int(total) }];
    ds.table = { columns: [{ key: 'picker', label: 'Picker' }, { key: 'count', label: 'Count', format: 'integer' }, { key: 'share', label: 'Share', format: 'percent' }], rows: arr };
    ds.chart = { kind: 'donut', rows: arr };
  } else if (def.type === 'sku_monthly') {
    const arr = Array.isArray(kpi) ? kpi : [];
    const combined = arr.map(r => (!isNum(r.y2026_cpt) && !isNum(r.y2026_george)) ? null : (r.y2026_cpt || 0) + (r.y2026_george || 0));
    const latest = lastNum(combined);
    const peakVal = maxNum(combined);
    const peakIdx = combined.indexOf(peakVal);
    const ytd = combined.filter(isNum).reduce((s, v) => s + v, 0);
    ds.card = { value: latest === null ? '-' : int(latest), tone: '' };
    ds.description = 'Monthly SKUs picked: 2026 CPT and George, with their combined total, against 2025 and 2024.';
    ds.facts = [{ label: 'Latest combined', value: int(latest) }, { label: 'Peak month', value: peakIdx >= 0 ? arr[peakIdx].month : '-' }, { label: '2026 total', value: int(ytd) }];
    ds.table = { columns: [{ key: 'month', label: 'Month' }, { key: 'y2024', label: '2024', format: 'integer' }, { key: 'y2025', label: '2025', format: 'integer' }, { key: 'y2026_cpt', label: '2026 CPT', format: 'integer' }, { key: 'y2026_george', label: '2026 George', format: 'integer' }], rows: arr };
    ds.chart = { kind: 'sku', labels: arr.map(r => r.month), cpt: arr.map(r => r.y2026_cpt), george: arr.map(r => r.y2026_george), combined, y2025: arr.map(r => r.y2025), y2024: arr.map(r => r.y2024) };
  }
  return ds;
}

function adapt(raw) {
  const k = (raw && raw.kpis) || {};
  return { generatedAt: raw && raw.generatedAt, datasets: KPI_DEFS.map(def => buildDataset(def, k[def.key])) };
}

/* ---------- view state ---------- */
function getDataset() { return dashboard && dashboard.datasets.find(d => d.key === selectedKey); }

function setStatus(kind, label) {
  document.getElementById('statusBadge').className = 'status' + (kind ? ' ' + kind : '');
  document.getElementById('statusText').textContent = label;
}
function updateCountdown() {
  document.getElementById('countdown').textContent = refreshBusy ? 'Checking now...' : `Next check in ${countdownValue}s`;
}
function restartAutoRefresh() {
  countdownValue = 60;
  updateCountdown();
  if (countdownTimer) clearInterval(countdownTimer);
  if (refreshTimer) clearInterval(refreshTimer);
  countdownTimer = setInterval(() => { countdownValue = Math.max(0, countdownValue - 1); updateCountdown(); }, 1000);
  refreshTimer = setInterval(() => refreshData(false), 60000);
}
function setRefreshBusy(busy) {
  refreshBusy = busy;
  const btn = document.getElementById('refreshBtn');
  btn.disabled = busy;
  btn.textContent = busy ? 'Refreshing...' : 'Refresh Now';
  updateCountdown();
}
function setView(mode) {
  viewMode = mode;
  document.getElementById('tableBtn').classList.toggle('active', mode === 'table');
  document.getElementById('chartBtn').classList.toggle('active', mode === 'chart');
  renderContent();
}
function setDataset(key) {
  selectedKey = key;
  renderSummary();
  renderDetail();
  renderContent();
}

/* ---------- renderers ---------- */
function renderSummary() {
  document.getElementById('summaryGrid').innerHTML = dashboard.datasets.map(d => `
    <article class="stat ${d.key === selectedKey ? 'active' : ''}" role="button" tabindex="0"
             onclick="setDataset('${esc(d.key)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();setDataset('${esc(d.key)}')}">
      <div class="k">${esc(d.label)}</div>
      <div class="v">${d.card.tone ? `<span class="sd ${d.card.tone}"></span>` : ''}${esc(d.card.value)}</div>
    </article>`).join('');
}

function renderDetail() {
  const d = getDataset();
  if (!d) return;
  document.getElementById('datasetTitle').textContent = d.label;
  document.getElementById('datasetDescription').textContent = d.description || '';
  document.getElementById('factGrid').innerHTML = (d.facts || []).map(f => `
    <article class="fact"><div class="k">${esc(f.label)}</div><div class="v">${esc(f.value)}</div></article>`).join('');
}

function renderTable(d) {
  const cols = d.table.columns, rows = d.table.rows;
  if (!rows.length) return '<div class="empty">No table data available yet.</div>';
  const head = cols.map(c => `<th>${esc(c.label)}</th>`).join('');
  const body = rows.map(r => `<tr>${cols.map(c => `<td>${fmt(r[c.key], c.format)}</td>`).join('')}</tr>`).join('');
  return `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function destroyChart() { if (chartInstance) { chartInstance.destroy(); chartInstance = null; } }

const AXIS = { x: { ticks: { color: '#9aa4b8' }, grid: { color: '#232a3d' } } };
const LEGEND = (extra) => ({ labels: Object.assign({ color: '#f2f4f8', usePointStyle: true, pointStyle: 'circle', padding: 16 }, extra || {}) });

function drawChart(d) {
  const c = d.chart;
  const ctx = document.getElementById('chartCanvas').getContext('2d');
  destroyChart();

  if (c.kind === 'donut') {
    chartInstance = new Chart(ctx, {
      type: 'doughnut',
      data: { labels: c.rows.map(r => r.picker), datasets: [{ data: c.rows.map(r => r.share), backgroundColor: c.rows.map((_, i) => PALETTE[i % PALETTE.length]) }] },
      options: {
        maintainAspectRatio: false, radius: '70%',
        plugins: {
          legend: LEGEND({ padding: 14 }),
          tooltip: { callbacks: { label: t => ` ${t.label}: ${int(c.rows[t.dataIndex].count)} (${pct1(c.rows[t.dataIndex].share)})` } },
        },
      },
    });
    return;
  }

  if (c.kind === 'sku') {
    const all = [...c.cpt, ...c.y2025, ...c.y2024, ...c.george, ...c.combined].filter(isNum);
    const mn = Math.min(...all), mx = Math.max(...all), pad = (mx - mn) * 0.15 || 0.05;
    const grad = ctx.createLinearGradient(0, 0, 0, 320);
    grad.addColorStop(0, 'rgba(79,163,224,0.30)');
    grad.addColorStop(1, 'rgba(79,163,224,0.02)');
    chartInstance = new Chart(ctx, {
      type: 'line',
      data: { labels: c.labels, datasets: [
        { label: '2026 CPT', data: c.cpt, borderColor: '#4fa3e0', backgroundColor: grad, borderWidth: 2.5, pointRadius: 3, pointBackgroundColor: '#4fa3e0', pointBorderColor: '#0a0d16', pointBorderWidth: 1, fill: true, tension: 0.3 },
        { label: '2026 George', data: c.george, borderColor: '#f472b6', borderDash: [4, 3], borderWidth: 1.5, pointRadius: 2, fill: false, tension: 0.3 },
        { label: '2026 Combined', data: c.combined, borderColor: '#ffffff', borderWidth: 2, pointRadius: 2, fill: false, tension: 0.3 },
        { label: '2025', data: c.y2025, borderColor: '#3ddc97', borderDash: [4, 3], borderWidth: 1.5, pointRadius: 2, fill: false, tension: 0.3 },
        { label: '2024', data: c.y2024, borderColor: '#ffb454', borderDash: [4, 3], borderWidth: 1.5, pointRadius: 2, fill: false, tension: 0.3 },
      ] },
      options: {
        maintainAspectRatio: false,
        plugins: { legend: LEGEND() },
        scales: { x: AXIS.x, y: { min: 0, max: mx + pad, ticks: { color: '#9aa4b8' }, grid: { color: '#232a3d' } } },
      },
    });
    return;
  }

  // percentage KPIs: gradient area + solid coloured trend line + dashed target
  const grad = ctx.createLinearGradient(0, 0, 0, 320);
  grad.addColorStop(0, hexToRgba(c.color, 0.35));
  grad.addColorStop(1, hexToRgba(c.color, 0.02));
  const datasets = [
    { label: d.label, data: c.values, borderColor: c.color, backgroundColor: grad, borderWidth: 0, pointRadius: 0, fill: true, tension: 0.3 },
    { label: 'Trend', data: c.values, borderColor: c.color, borderWidth: 2.5, pointRadius: 3, pointBackgroundColor: c.color, pointBorderColor: '#0a0d16', pointBorderWidth: 1, fill: false, tension: 0.3 },
  ];
  if (c.target !== null && c.target !== undefined) {
    datasets.push({ label: 'Target', data: c.labels.map(() => c.target), borderColor: '#e8ecf5', borderDash: [6, 4], borderWidth: 1.5, pointRadius: 0, fill: false });
  }
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: { labels: c.labels, datasets },
    options: {
      maintainAspectRatio: false,
      plugins: {
        legend: LEGEND({ filter: item => !(c.hideMain && item.text === d.label) }),
        tooltip: { callbacks: { label: t => ` ${t.dataset.label}: ${pct1(t.parsed.y)}` } },
      },
      scales: {
        x: AXIS.x,
        y: { min: 0, max: c.yMax, ticks: { stepSize: 0.1, color: '#9aa4b8', callback: v => Math.round(v * 100) + '%' }, grid: { color: '#232a3d' } },
      },
    },
  });
}

function renderContent() {
  const d = getDataset();
  const body = document.getElementById('contentBody'), wrap = document.getElementById('chartWrap');
  if (!d) { destroyChart(); wrap.style.display = 'none'; body.style.display = 'block'; body.innerHTML = '<div class="empty">No data available yet.</div>'; return; }
  document.getElementById('contentTitle').textContent = `${d.label} ${viewMode === 'table' ? 'Table' : 'Chart'}`;
  if (viewMode === 'table') { destroyChart(); wrap.style.display = 'none'; body.style.display = 'block'; body.innerHTML = renderTable(d); return; }
  body.style.display = 'none'; wrap.style.display = 'block';
  drawChart(d);
}

/* ---------- data loading ---------- */
async function refreshData(isManual) {
  setRefreshBusy(true);
  if (isManual) setStatus('', 'Refreshing');
  try {
    const res = await fetch(`dashboard_data.json?ts=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    dashboard = adapt(await res.json());
    document.getElementById('generatedAt').textContent = fmtDate(dashboard.generatedAt);
    const age = Date.now() - new Date(dashboard.generatedAt).getTime();
    if (age > 15 * 60 * 1000) setStatus('warn', 'Stale'); else setStatus('', 'Live');
    renderSummary();
    renderDetail();
    renderContent();
    restartAutoRefresh();
  } catch (err) {
    console.error(err);
    setStatus('bad', 'Unavailable');
    const body = document.getElementById('contentBody');
    destroyChart(); document.getElementById('chartWrap').style.display = 'none';
    body.style.display = 'block';
    body.innerHTML = `<div class="empty">Could not load dashboard data. ${esc(err.message || err)}</div>`;
  } finally {
    setRefreshBusy(false);
  }
}
function manualRefresh() { refreshData(true); }

refreshData(false);
</script>
