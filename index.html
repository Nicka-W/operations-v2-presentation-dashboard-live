<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hydrofire Cape Town Warehouse Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d16;
    --panel: #131826;
    --panel-border: #232a3d;
    --text: #f2f4f8;
    --text-dim: #9aa4b8;
    --red: #ff5470;
    --orange: #ffb454;
    --green: #3ddc97;
    --target-line: #3ddc97;
    --trend-line: #ffffff;
    --brand-blue: #1b75bc;
    --brand-blue-light: #4fa3e0;
    --flame-1: #f5841f;
    --flame-2: #ef4136;
    --flame-3: #c1272d;
    --accent: var(--brand-blue-light);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    position: relative;
  }
  body::before {
    content: "";
    position: fixed;
    top: -20%;
    left: 0;
    width: 100%;
    height: 480px;
    background:
      radial-gradient(circle at 8% 0%, rgba(27, 117, 188, 0.16), transparent 55%),
      radial-gradient(circle at 32% 10%, rgba(245, 132, 31, 0.10), transparent 50%);
    pointer-events: none;
    z-index: 0;
  }
  header, .brand-stripe, .refresh-row, .kpi-strip, .controls, .facts-strip, .panel {
    position: relative;
    z-index: 1;
  }
  header {
    padding: 20px 28px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .brand img {
    height: 62px;
    width: auto;
    display: block;
    filter: drop-shadow(0 0 22px rgba(239, 65, 54, 0.35));
  }
  .brand-divider {
    width: 1px;
    height: 34px;
    background: var(--panel-border);
  }
  .brand-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .eyebrow {
    font-family: "Inter", sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--flame-1);
  }
  h1 {
    font-family: "Sora", "Inter", sans-serif;
    font-size: 30px;
    margin: 0;
    letter-spacing: -0.02em;
    font-weight: 800;
    color: #f7f9ff;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.5);
  }
  .brand-stripe {
    height: 3px;
    margin: 0 28px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--brand-blue) 0%, var(--flame-1) 55%, var(--flame-3) 100%);
    box-shadow: 0 0 16px rgba(239, 65, 54, 0.35), 0 0 16px rgba(27, 117, 188, 0.25);
  }
  .latest-reading {
    background: var(--panel);
    border: 1px solid rgba(79, 163, 224, 0.35);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .latest-reading b { color: var(--text); }

  .kpi-strip {
    display: flex;
    flex-wrap: nowrap;
    gap: 10px;
    padding: 12px 28px;
    overflow-x: auto;
  }
  .kpi-card {
    flex: 1 1 0;
    min-width: 100px;
  }
  .kpi-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-left: 3px solid transparent;
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
  }
  .kpi-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(27, 117, 188, 0.18);
  }
  .kpi-card.active {
    border-color: var(--brand-blue-light);
    border-left: 3px solid var(--flame-1);
    box-shadow: 0 0 0 1px rgba(79, 163, 224, 0.25);
  }
  .kpi-card .label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  .kpi-card .value {
    font-family: "Sora", "Inter", sans-serif;
    font-size: 23px;
    font-weight: 700;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    margin-top: 5px;
  }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.red { background: var(--red); }
  .dot.orange { background: var(--orange); }
  .dot.green { background: var(--green); }

  .controls {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 4px 28px 0;
    flex-wrap: wrap;
    gap: 10px;
  }
  .toggle {
    display: flex;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    overflow: hidden;
  }
  .toggle button {
    background: var(--panel);
    color: var(--text-dim);
    border: none;
    padding: 6px 16px;
    font-size: 12px;
    cursor: pointer;
  }
  .toggle button.active {
    background: linear-gradient(90deg, var(--brand-blue-light), var(--flame-1));
    color: #0a0d16;
    font-weight: 600;
  }

  .facts-strip {
    padding: 12px 28px 0;
    display: flex;
    gap: 24px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .facts-strip b { color: var(--text); }

  .panel {
    margin: 14px 28px 28px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 18px;
    min-height: 360px;
    transition: border-color 0.2s ease;
  }
  .panel:hover {
    border-color: rgba(79, 163, 224, 0.3);
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--panel-border); }

  .chart-wrap {
    position: relative;
    height: 320px;
  }
  .chart-wrap canvas {
    position: relative;
    z-index: 1;
  }
  .chart-wrap::before {
    content: "";
    position: absolute;
    inset: -10%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 85%, rgba(245, 132, 31, 0.24), transparent 42%),
      radial-gradient(circle at 55% 95%, rgba(239, 65, 54, 0.20), transparent 46%),
      radial-gradient(circle at 80% 88%, rgba(193, 39, 45, 0.16), transparent 40%);
    filter: blur(30px);
    animation: emberFlicker 4.5s ease-in-out infinite alternate;
  }
  @keyframes emberFlicker {
    0%   { opacity: 0.55; transform: scale(1) translateY(0); }
    35%  { opacity: 0.85; transform: scale(1.04) translateY(-6px); }
    65%  { opacity: 0.65; transform: scale(0.98) translateY(3px); }
    100% { opacity: 0.9;  transform: scale(1.03) translateY(-3px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .chart-wrap::before { animation: none; opacity: 0.7; }
  }
  th { color: var(--text-dim); font-weight: 600; text-transform: uppercase; font-size: 11px; }

  .refresh-row {
    padding: 0 28px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .refresh-row button {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .refresh-row button:hover {
    border-color: var(--flame-1);
    color: var(--flame-1);
  }
  .refresh-row span { font-size: 11px; color: var(--text-dim); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="logo.png" alt="Hydrofire logo">
    <div class="brand-divider"></div>
    <div class="brand-text">
      <span class="eyebrow">Hydrofire Operations</span>
      <h1>Cape Town Warehouse Dashboard</h1>
    </div>
  </div>
  <div class="latest-reading">Latest reading: <b id="latestReading">—</b></div>
</header>
<div class="brand-stripe"></div>

<div class="refresh-row">
  <button id="refreshBtn">Refresh Now</button>
  <span id="refreshStatus"></span>
</div>

<div class="kpi-strip" id="kpiStrip"></div>

<div class="controls">
  <div class="toggle">
    <button id="tableToggle" class="active">Table</button>
    <button id="chartToggle">Chart</button>
  </div>
</div>

<div class="panel">
  <div id="tableView"></div>
  <div class="chart-wrap" id="chartWrap" style="display:none;">
    <canvas id="chartView"></canvas>
  </div>
</div>

<script>
const KPI_DEFS = [
  { key: "housekeeping", label: "Housekeeping", type: "housekeeping" },
  { key: "container-jhb", label: "JHB Accuracy", type: "accuracy" },
  { key: "container-george", label: "George Accuracy", type: "accuracy" },
  { key: "urgent-orders", label: "Urgent Orders", type: "urgent" },
  { key: "dispatch-accuracy", label: "Dispatch Accuracy", type: "accuracy" },
  { key: "sku-share", label: "SKU Share", type: "donut" },
  { key: "sku-monthly", label: "SKU 2026 YTD", type: "sku_monthly" },
  { key: "assembly-backorders", label: "Assembly Fill Rate", type: "fill_rate" },
];

// Each KPI gets its own accent color so charts read distinctly at a glance
// instead of every line being the same generic blue.
const KPI_COLORS = {
  "housekeeping": "#4fa3e0",
  "container-jhb": "#1b75bc",
  "container-george": "#38bdf8",
  "dispatch-accuracy": "#8b7cf6",
  "urgent-orders": "#f5841f",
  "assembly-backorders": "#3ddc97",
};

Chart.defaults.font.family = "'Inter', sans-serif";

function hexToRgba(hex, alpha) {
  const h = hex.replace("#", "");
  const full = h.length === 3 ? h.split("").map(c => c + c).join("") : h;
  const num = parseInt(full, 16);
  const r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
  return `rgba(${r},${g},${b},${alpha})`;
}

let dashboardData = null;
let activeKpi = "housekeeping";
let activeView = "table";
let chartInstance = null;

function colorFor(type, value) {
  if (value === null || value === undefined || value === "") return "";
  if (type === "housekeeping") {
    if (value < 0.50) return "red";
    if (value < 0.80) return "orange";
    return "green";
  }
  if (type === "accuracy") {
    if (value <= 0.97) return "red";
    if (value < 0.99) return "orange";
    return "green";
  }
  if (type === "urgent") {
    if (value <= 0.05) return "green";
    if (value <= 0.10) return "orange";
    return "red";
  }
  if (type === "fill_rate") {
    if (value < 0.70) return "red";
    if (value < 0.85) return "orange";
    return "green";
  }
  return "";
}

function pct(v) {
  if (v === null || v === undefined || v === "") return "—";
  return (v * 100).toFixed(1) + "%";
}

async function loadData() {
  document.getElementById("refreshStatus").textContent = "Loading…";
  try {
    const res = await fetch("dashboard_data.json?_=" + Date.now());
    dashboardData = await res.json();
    document.getElementById("latestReading").textContent =
      new Date(dashboardData.generatedAt).toLocaleString();
    document.getElementById("refreshStatus").textContent = "";
    renderAll();
  } catch (e) {
    document.getElementById("refreshStatus").textContent = "Failed to load dashboard_data.json";
  }
}

function latestValue(key, type) {
  const kpi = dashboardData.kpis[key];
  if (type === "housekeeping") {
    const w = kpi.weekly;
    return w && w.length ? w[w.length - 1].value_92m : null;
  }
  if (type === "donut") return null;
  if (type === "sku_monthly") return null;
  if (Array.isArray(kpi) && kpi.length) {
    for (let i = kpi.length - 1; i >= 0; i--) {
      const v = kpi[i].value ?? kpi[i].fill_rate;
      if (v !== null && v !== undefined) return v;
    }
    return null;
  }
  return null;
}

function topShareName(kpi) {
  if (!Array.isArray(kpi) || !kpi.length) return "—";
  const top = kpi.reduce((a, b) => (b.share > a.share ? b : a));
  return top.picker;
}

function latestCombinedSku(kpi) {
  if (!Array.isArray(kpi)) return null;
  for (let i = kpi.length - 1; i >= 0; i--) {
    const r = kpi[i];
    if (r.y2026_cpt !== null && r.y2026_cpt !== undefined || r.y2026_george !== null && r.y2026_george !== undefined) {
      return (r.y2026_cpt || 0) + (r.y2026_george || 0);
    }
  }
  return null;
}

function renderKpiStrip() {
  const strip = document.getElementById("kpiStrip");
  strip.innerHTML = "";
  KPI_DEFS.forEach(def => {
    let color = "", displayValue;
    if (def.type === "donut") {
      displayValue = topShareName(dashboardData.kpis[def.key]);
    } else if (def.type === "sku_monthly") {
      const combined = latestCombinedSku(dashboardData.kpis[def.key]);
      displayValue = combined !== null ? combined.toLocaleString() : "—";
    } else {
      const val = latestValue(def.key, def.type);
      color = colorFor(def.type, val);
      displayValue = val !== null ? pct(val) : "—";
    }
    const card = document.createElement("div");
    card.className = "kpi-card" + (def.key === activeKpi ? " active" : "");
    card.onclick = () => { activeKpi = def.key; render(); };
    card.innerHTML = `
      <div class="label">${def.label}</div>
      <div class="value">${color ? `<span class="dot ${color}"></span>` : ""}${displayValue}</div>
    `;
    strip.appendChild(card);
  });
}

function renderFacts() {
  const def = KPI_DEFS.find(d => d.key === activeKpi);
  const kpi = dashboardData.kpis[activeKpi];
  const facts = document.getElementById("factsStrip");
  let count = Array.isArray(kpi) ? kpi.length : (kpi.weekly ? kpi.weekly.length : 0);
  facts.innerHTML = `<span><b>${count}</b> data points</span>
    <span>Source: <b>Operations Data.xlsx</b></span>
    <span>Generated: <b>${new Date(dashboardData.generatedAt).toLocaleString()}</b></span>`;
}

function renderTable() {
  const def = KPI_DEFS.find(d => d.key === activeKpi);
  const kpi = dashboardData.kpis[activeKpi];
  const container = document.getElementById("tableView");
  let rows = [];

  if (def.type === "housekeeping") {
    rows = kpi.weekly.map(r => [r.week, pct(r.value_92m), pct(r.value_12m)]);
    container.innerHTML = tableHtml(["Week", "92M", "12M"], rows);
  } else if (def.type === "donut") {
    rows = kpi.map(r => [r.picker, r.count, pct(r.share)]);
    container.innerHTML = tableHtml(["Picker", "Count", "Share"], rows);
  } else if (def.type === "sku_monthly") {
    rows = kpi.map(r => [r.month, r.y2024, r.y2025, r.y2026_cpt, r.y2026_george ?? "—"]);
    container.innerHTML = tableHtml(["Month", "2024", "2025", "2026 CPT", "2026 George"], rows);
  } else if (def.type === "fill_rate") {
    rows = kpi.map(r => [r.month, r.assembled, r.backorders, pct(r.fill_rate)]);
    container.innerHTML = tableHtml(["Month", "Assembled", "Backorders", "Fill Rate"], rows);
  } else {
    rows = kpi.map(r => [r.label, pct(r.value)]);
    container.innerHTML = tableHtml(["Period", "Value"], rows);
  }
}

function tableHtml(headers, rows) {
  return `<table>
    <thead><tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody>
  </table>`;
}

function renderChart() {
  const def = KPI_DEFS.find(d => d.key === activeKpi);
  const kpi = dashboardData.kpis[activeKpi];
  const ctx = document.getElementById("chartView").getContext("2d");
  if (chartInstance) chartInstance.destroy();

  if (def.type === "donut") {
    chartInstance = new Chart(ctx, {
      type: "doughnut",
      data: {
        labels: kpi.map(r => r.picker),
        datasets: [{ data: kpi.map(r => r.share), backgroundColor: paletteFor(kpi.length) }],
      },
      options: { maintainAspectRatio: false, plugins: { legend: { labels: { color: "#f2f4f8", usePointStyle: true, pointStyle: "circle", padding: 14 } } }, radius: "70%" },
    });
    return;
  }

  if (def.type === "sku_monthly") {
    const labels = kpi.map(r => r.month);
    const series2026 = kpi.map(r => r.y2026_cpt);
    const series2025 = kpi.map(r => r.y2025);
    const series2024 = kpi.map(r => r.y2024);
    const seriesGeorge = kpi.map(r => r.y2026_george);
    const seriesCombined = kpi.map(r =>
      (r.y2026_cpt == null && r.y2026_george == null) ? null : (r.y2026_cpt || 0) + (r.y2026_george || 0)
    );
    const allValues = [...series2026, ...series2025, ...series2024, ...seriesGeorge, ...seriesCombined].filter(v => v !== null && v !== undefined);
    const mn = Math.min(...allValues);
    const mx = Math.max(...allValues);
    const pad2 = (mx - mn) * 0.15 || 0.05;

    const cptGradient = ctx.createLinearGradient(0, 0, 0, 320);
    cptGradient.addColorStop(0, "rgba(79,163,224,0.30)");
    cptGradient.addColorStop(1, "rgba(79,163,224,0.02)");

    chartInstance = new Chart(ctx, {
      type: "line",
      data: {
        labels,
        datasets: [
          { label: "2026 CPT", data: series2026, borderColor: "#4fa3e0", backgroundColor: cptGradient, borderWidth: 2.5, pointRadius: 3, pointBackgroundColor: "#4fa3e0", pointBorderColor: "#0a0d16", pointBorderWidth: 1, fill: true, tension: 0.3 },
          { label: "2026 George", data: seriesGeorge, borderColor: "#f472b6", borderDash: [4, 3], borderWidth: 1.5, pointRadius: 2, fill: false, tension: 0.3 },
          { label: "2026 Combined", data: seriesCombined, borderColor: "#ffffff", borderWidth: 2, pointRadius: 2, fill: false, tension: 0.3 },
          { label: "2025", data: series2025, borderColor: "#3ddc97", borderDash: [4, 3], borderWidth: 1.5, pointRadius: 2, fill: false, tension: 0.3 },
          { label: "2024", data: series2024, borderColor: "#ffb454", borderDash: [4, 3], borderWidth: 1.5, pointRadius: 2, fill: false, tension: 0.3 },
        ],
      },
      options: {
        maintainAspectRatio: false,
        plugins: { legend: { labels: { color: "#f2f4f8", usePointStyle: true, pointStyle: "circle", padding: 16 } } },
        scales: {
          x: { ticks: { color: "#9aa4b8" }, grid: { color: "#232a3d" } },
          y: { min: 0, max: mx + pad2, ticks: { color: "#9aa4b8" }, grid: { color: "#232a3d" } },
        },
      },
    });
    return;
  }

  let labels, values, targetValue;
  if (def.type === "housekeeping") {
    labels = kpi.weekly.map(r => r.week);
    values = kpi.weekly.map(r => r.value_92m);
    targetValue = 0.80;
  } else if (def.type === "fill_rate") {
    labels = kpi.map(r => r.month);
    values = kpi.map(r => r.fill_rate);
    targetValue = 0.85;
  } else {
    labels = kpi.map(r => r.label);
    values = kpi.map(r => r.value);
    targetValue = def.type === "accuracy" ? 1.0 : null;
  }

  const numeric = values.filter(v => v !== null && v !== undefined);
  const min = Math.min(...numeric);
  const max = Math.max(...numeric);
  const pad = (max - min) * 0.15 || 0.05;

  // These 5 KPIs are percentages, so lock the axis to 0-100% in steps of 10
  const fixedRangeKpis = ["housekeeping", "container-jhb", "container-george", "dispatch-accuracy", "assembly-backorders"];
  const useFixedRange = fixedRangeKpis.includes(activeKpi);

  // Urgent Orders: 0% up to the highest value in the data, in steps of 10%
  const isUrgent = activeKpi === "urgent-orders";
  const urgentMax = isUrgent ? Math.max(0.1, Math.ceil(Math.max(...numeric, 0) * 10) / 10) : null;

  // These KPIs asked to hide their raw-value line from the legend (Trend/Target stay visible)
  const hideMainLegend = ["housekeeping", "container-jhb", "container-george", "dispatch-accuracy", "urgent-orders"].includes(activeKpi);

  const accentColor = KPI_COLORS[activeKpi] || "#4fa3e0";
  const gradient = ctx.createLinearGradient(0, 0, 0, 320);
  gradient.addColorStop(0, hexToRgba(accentColor, 0.35));
  gradient.addColorStop(1, hexToRgba(accentColor, 0.02));

  const datasets = [{
    label: def.label,
    data: values,
    borderColor: accentColor,
    backgroundColor: gradient,
    borderWidth: 0,
    pointRadius: 0,
    fill: true,
    tension: 0.3,
  }];

  // Trend line: solid, colored to match this KPI's accent
  datasets.push({
    label: "Trend",
    data: values,
    borderColor: accentColor,
    borderWidth: 2.5,
    pointRadius: 3,
    pointBackgroundColor: accentColor,
    pointBorderColor: "#0a0d16",
    pointBorderWidth: 1,
    fill: false,
    tension: 0.3,
  });

  // Target line: neutral so it always reads distinctly from the trend color
  if (targetValue !== null) {
    datasets.push({
      label: "Target",
      data: labels.map(() => targetValue),
      borderColor: "#e8ecf5",
      borderDash: [6, 4],
      borderWidth: 1.5,
      pointRadius: 0,
      fill: false,
    });
  }

  chartInstance = new Chart(ctx, {
    type: "line",
    data: { labels, datasets },
    options: {
      maintainAspectRatio: false,
      plugins: {
        legend: {
          labels: {
            color: "#f2f4f8",
            usePointStyle: true,
            pointStyle: "circle",
            padding: 16,
            filter: (item) => !(hideMainLegend && item.text === def.label),
          },
        },
      },
      scales: {
        x: { ticks: { color: "#9aa4b8" }, grid: { color: "#232a3d" } },
        y: useFixedRange ? {
          min: 0,
          max: 1,
          ticks: {
            stepSize: 0.1,
            color: "#9aa4b8",
            callback: (v) => Math.round(v * 100) + "%",
          },
          grid: { color: "#232a3d" },
        } : isUrgent ? {
          min: 0,
          max: urgentMax,
          ticks: {
            stepSize: 0.1,
            color: "#9aa4b8",
            callback: (v) => Math.round(v * 100) + "%",
          },
          grid: { color: "#232a3d" },
        } : {
          min: min - pad,
          max: max + pad,
          ticks: { color: "#9aa4b8" },
          grid: { color: "#232a3d" },
        },
      },
    },
  });
}

function paletteFor(n) {
  const base = ["#4fa3e0", "#3ddc97", "#ffb454", "#ff5470", "#a78bfa", "#f472b6", "#facc15", "#38bdf8"];
  const out = [];
  for (let i = 0; i < n; i++) out.push(base[i % base.length]);
  return out;
}

function render() {
  renderKpiStrip();
  // facts strip removed from dashboard
  if (activeView === "table") {
    document.getElementById("tableView").style.display = "block";
    document.getElementById("chartWrap").style.display = "none";
    renderTable();
  } else {
    document.getElementById("tableView").style.display = "none";
    document.getElementById("chartWrap").style.display = "block";
    renderChart();
  }
}

function renderAll() { render(); }

document.getElementById("tableToggle").onclick = () => {
  activeView = "table";
  document.getElementById("tableToggle").classList.add("active");
  document.getElementById("chartToggle").classList.remove("active");
  render();
};
document.getElementById("chartToggle").onclick = () => {
  activeView = "chart";
  document.getElementById("chartToggle").classList.add("active");
  document.getElementById("tableToggle").classList.remove("active");
  render();
};
document.getElementById("refreshBtn").onclick = loadData;

// Poll every 60 seconds, same as the original dashboard
loadData();
setInterval(loadData, 60000);
</script>

</body>
